spring.application.name=krushisetu-java

server.address=0.0.0.0
server.port=8080

# Kafka configuration
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topic=farmer.registered

# PostgreSQL configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/krushisetu}
spring.datasource.username=${DB_USERNAME:krushisetu_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
